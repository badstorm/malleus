[workspace]
resolver = "3"
members = ["src/crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/duckpage/malleus"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
malleus-hip = { path = "src/crates/malleus-hip" }
malleus-gguf = { path = "src/crates/malleus-gguf" }
malleus-model = { path = "src/crates/malleus-model" }
malleus-chat = { path = "src/crates/malleus-chat" }
malleus-convert = { path = "src/crates/malleus-convert" }
malleus-sched = { path = "src/crates/malleus-sched" }
malleus-api = { path = "src/crates/malleus-api" }

[profile.release]
debug = 1
